[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "timelapse-engine"
version = "0.4.0"
description = "Stacking and rolling-window blending for large timelapse sequences and video"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "opencv-python",
    "pillow",
    "tifffile",
    "imageio[ffmpeg]",
    "pyexiftool",
    "piexif",
    "matplotlib",
    "psutil",
]

[project.optional-dependencies]
gpu = ["cupy-cuda12x"]
gui = ["PySide6>=6.7"]
test = ["pytest"]

[project.scripts]
timelapse-sort = "timelapse_engine.sorter:main"

[project.gui-scripts]
timelapse-gui = "timelapse_engine.gui:main"

[tool.setuptools]
packages = ["timelapse_engine", "timelapse_engine.gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
